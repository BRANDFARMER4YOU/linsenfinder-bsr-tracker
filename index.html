<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linsenfinder Mastermind</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #00C853;
      --accent-light: #69F0AE;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    header h1 span {
      color: var(--accent);
    }

    nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(0, 200, 83, 0.08);
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .section {
      margin-bottom: 3rem;
      scroll-margin-top: 70px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    .last-updated {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
    }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 900px) {
      .charts-row { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .chart-wrapper {
      position: relative;
      height: 280px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      transition: border-color 0.2s;
    }

    .product-card:hover {
      border-color: var(--accent);
    }

    .product-card.fx {
      border-color: rgba(0, 200, 83, 0.4);
      background: rgba(0, 200, 83, 0.04);
    }

    .product-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .product-stats {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    .stat-label {
      color: var(--text-muted);
    }

    .stat-value {
      color: var(--text-bright);
      font-weight: 600;
    }

    .bsr-value {
      color: var(--accent-light);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 3rem;
      color: #f85149;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2.5rem 0;
    }

    .country-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 200, 83, 0.1);
      border: 1px solid rgba(0, 200, 83, 0.3);
      color: var(--accent-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <h1>📊 Linsenfinder <span>Mastermind</span></h1>
  <nav id="nav">
    <a href="#de">🇩🇪 DE</a>
    <a href="#it">🇮🇹 IT</a>
    <a href="#fr">🇫🇷 FR</a>
    <a href="#es">🇪🇸 ES</a>
    <a href="#keywords">🔍 Keywords</a>
  </nav>
</header>

<main id="app">
  <div class="loading">
    <div class="spinner"></div>
    Lade Daten…
  </div>
</main>

<script>
// ─── Ranking-Logik ───────────────────────────────────────────────────────────
function computeRankings(seriesData) {
  const dates = [...new Set(seriesData.flatMap(s => s.data.map(d => d.date)))].sort();
  const rankings = {};
  seriesData.forEach(s => rankings[s.id] = []);
  dates.forEach(date => {
    const entries = seriesData
      .map(s => ({ id: s.id, bsr: s.data.find(d => d.date === date)?.bsr }))
      .filter(e => e.bsr != null)
      .sort((a, b) => a.bsr - b.bsr);
    entries.forEach((e, i) => rankings[e.id].push({ x: e.date || date, y: i + 1 }));
    // fix: need date in x
  });
  // Re-compute properly with date in scope
  seriesData.forEach(s => rankings[s.id] = []);
  dates.forEach(date => {
    const entries = seriesData
      .map(s => ({ id: s.id, bsr: s.data.find(d => d.date === date)?.bsr }))
      .filter(e => e.bsr != null)
      .sort((a, b) => a.bsr - b.bsr);
    entries.forEach((e, i) => rankings[e.id].push({ x: date, y: i + 1 }));
  });
  return { rankings, dates };
}

// ─── Farben & Stil ──────────────────────────────────────────────────────────
function isFX(id) {
  return id && (id.toLowerCase().includes('fx') || id.toLowerCase().includes('fxcontacts'));
}

function getLineStyle(series) {
  const fx = isFX(series.id);
  return {
    borderWidth: fx ? 3 : 1.5,
    borderDash: fx ? [] : [],
    pointRadius: fx ? 4 : 2,
    pointHoverRadius: fx ? 6 : 4,
    tension: 0.3,
  };
}

// ─── Chart-Defaults ──────────────────────────────────────────────────────────
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

// ─── Ranking-Chart erstellen ─────────────────────────────────────────────────
function createRankingChart(canvasId, seriesData) {
  const { rankings, dates } = computeRankings(seriesData);
  const maxRank = seriesData.length;

  const datasets = seriesData.map(s => ({
    label: s.label,
    data: rankings[s.id],
    borderColor: s.color,
    backgroundColor: s.color + '22',
    parsing: { xAxisKey: 'x', yAxisKey: 'y' },
    ...getLineStyle(s),
  }));

  return new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 12, padding: 10, font: { size: 11 } }
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: Rang ${ctx.parsed.y}`
          }
        }
      },
      scales: {
        x: {
          type: 'category',
          grid: { color: '#21262d' },
          ticks: { maxRotation: 45, font: { size: 10 } }
        },
        y: {
          reverse: true,
          min: 1,
          max: maxRank,
          ticks: {
            stepSize: 1,
            callback: v => `#${v}`,
            font: { size: 11 }
          },
          grid: { color: '#21262d' },
          title: { display: true, text: 'Rang', font: { size: 11 } }
        }
      }
    }
  });
}

// ─── BSR-Chart erstellen ─────────────────────────────────────────────────────
function createBsrChart(canvasId, seriesData) {
  const datasets = seriesData.map(s => ({
    label: s.label,
    data: s.data.map(d => ({ x: d.date, y: d.bsr })),
    borderColor: s.color,
    backgroundColor: s.color + '22',
    ...getLineStyle(s),
  }));

  return new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 12, padding: 10, font: { size: 11 } }
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: BSR ${ctx.parsed.y.toLocaleString('de-DE')}`
          }
        }
      },
      scales: {
        x: {
          type: 'category',
          grid: { color: '#21262d' },
          ticks: { maxRotation: 45, font: { size: 10 } }
        },
        y: {
          type: 'logarithmic',
          grid: { color: '#21262d' },
          ticks: {
            callback: v => v.toLocaleString('de-DE'),
            font: { size: 10 }
          },
          title: { display: true, text: 'BSR (Log)', font: { size: 11 } }
        }
      }
    }
  });
}

// ─── Produkt-Cards ───────────────────────────────────────────────────────────
function renderProductCards(container, seriesData) {
  const grid = document.createElement('div');
  grid.className = 'products-grid';

  seriesData.forEach(s => {
    const latest = s.data[s.data.length - 1];
    if (!latest) return;

    const card = document.createElement('div');
    card.className = 'product-card' + (isFX(s.id) ? ' fx' : '');

    card.innerHTML = `
      <div class="product-label">
        <div class="color-dot" style="background:${s.color}"></div>
        ${s.label}
      </div>
      <div class="product-stats">
        <div class="stat-row">
          <span class="stat-label">BSR</span>
          <span class="stat-value bsr-value">#${latest.bsr?.toLocaleString('de-DE') ?? '–'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">💰 Preis</span>
          <span class="stat-value">${latest.price != null ? latest.price.toFixed(2) + ' €' : '–'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">⭐ Reviews</span>
          <span class="stat-value">${latest.reviews?.toLocaleString('de-DE') ?? '–'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Rating</span>
          <span class="stat-value">${latest.rating != null ? '⭐ ' + latest.rating.toFixed(1) : '–'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Datum</span>
          <span class="stat-value" style="color:var(--text-muted);font-size:0.78rem">${latest.date}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  container.appendChild(grid);
}

// ─── Sektion rendern ─────────────────────────────────────────────────────────
let chartCount = 0;

function renderSection(app, id, flag, name, seriesData, updated, analysis) {
  if (!seriesData || seriesData.length === 0) return;

  const rankId = `chart-rank-${++chartCount}`;
  const bsrId = `chart-bsr-${++chartCount}`;

  const section = document.createElement('div');
  section.className = 'section';
  section.id = id;

  section.innerHTML = `
    <div class="section-header">
      <div class="section-title">${flag} ${name}</div>
      <span class="last-updated">Zuletzt aktualisiert: ${updated ?? '–'}</span>
    </div>
    <div class="charts-row">
      <div class="card">
        <div class="card-title">📈 Ranking-Verlauf</div>
        <div class="chart-wrapper"><canvas id="${rankId}"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">📊 Absoluter BSR</div>
        <div class="chart-wrapper"><canvas id="${bsrId}"></canvas></div>
      </div>
    </div>
  `;

  app.appendChild(section);

  // Render charts
  createRankingChart(rankId, seriesData);
  createBsrChart(bsrId, seriesData);

  // KI-Analyse Block
  if (analysis?.text) {
    const rankEmoji = analysis.fx_rank === 1 ? '🥇' : analysis.fx_rank === 2 ? '🥈' : analysis.fx_rank === 3 ? '🥉' : '📊';
    const analysisBlock = document.createElement('div');
    analysisBlock.className = 'card';
    analysisBlock.style.marginBottom = '1rem';
    analysisBlock.innerHTML = `
      <div class="card-title" style="display:flex;align-items:center;gap:0.5rem;">
        🤖 KI-Lagebericht
        <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted);margin-left:auto">${rankEmoji} Rang ${analysis.fx_rank ?? '?'} von ${analysis.total_products ?? '?'} • BSR #${analysis.fx_bsr?.toLocaleString('de-DE') ?? '–'}</span>
      </div>
      <p style="font-size:0.9rem;line-height:1.65;color:var(--text);">${analysis.text}</p>
    `;
    section.appendChild(analysisBlock);
  }

  // Product cards
  const cardsSection = document.createElement('div');
  cardsSection.innerHTML = `<div class="card-title" style="margin-bottom:0.75rem;font-size:0.85rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Aktuelle Produkt-Infos</div>`;
  renderProductCards(cardsSection, seriesData);
  section.appendChild(cardsSection);

  // Divider
  const div = document.createElement('div');
  div.className = 'divider';
  app.appendChild(div);
}

// ─── Haupt-App ───────────────────────────────────────────────────────────────
async function init() {
  const app = document.getElementById('app');

  let data;
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    app.innerHTML = `<div class="error">
      <p>⚠️ Fehler beim Laden von data.json</p>
      <p style="font-size:0.85rem;margin-top:0.5rem;opacity:0.6">${err.message}</p>
    </div>`;
    return;
  }

  app.innerHTML = '';

  const countries = [
    { id: 'de', flag: '🇩🇪', name: 'Deutschland', key: 'series',    land: 'DE' },
    { id: 'it', flag: '🇮🇹', name: 'Italien',     key: 'series_it', land: 'IT' },
    { id: 'fr', flag: '🇫🇷', name: 'Frankreich',  key: 'series_fr', land: 'FR' },
    { id: 'es', flag: '🇪🇸', name: 'Spanien',     key: 'series_es', land: 'ES' },
  ];

  const updated = data.updated ?? null;

  // KI-Analyse laden (optional, kein Fehler wenn nicht vorhanden)
  let analysis = null;
  try {
    const aRes = await fetch('./analysis.json');
    if (aRes.ok) analysis = await aRes.json();
  } catch (_) {}

  countries.forEach(c => {
    const series = data[c.key];
    const countryAnalysis = analysis?.countries?.[c.land] ?? null;
    renderSection(app, c.id, c.flag, c.name, series, updated, countryAnalysis);
  });

  // Active nav on scroll
  const sections = document.querySelectorAll('.section');
  const navLinks = document.querySelectorAll('nav a');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        navLinks.forEach(l => l.classList.remove('active'));
        const link = document.querySelector(`nav a[href="#${entry.target.id}"]`);
        if (link) link.classList.add('active');
      }
    });
  }, { threshold: 0.3 });

  sections.forEach(s => observer.observe(s));
}

// (init() is called at the bottom after keyword section setup)

// ─── Keyword Rankings Section ─────────────────────────────────────────────
async function loadKeywordData() {
  try {
    const res = await fetch('./keyword_data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    log.warn && console.warn('keyword_data.json not available:', err.message);
    return null;
  }
}

function getRankColor(rank) {
  if (rank == null) return '#8b949e';       // grey — not found
  if (rank <= 3)    return '#00C853';       // green — top 3
  if (rank <= 10)   return '#FFD600';       // yellow — top 10
  return '#F44336';                         // red — >10
}

function getRankBadge(rank) {
  if (rank == null) return '<span style="color:#8b949e">–</span>';
  const color = getRankColor(rank);
  return `<span style="color:${color};font-weight:700">#${rank}</span>`;
}

function getTrendArrow(data, field) {
  if (!data || data.length < 2) return '<span style="color:#8b949e">→</span>';
  const recent = data.slice(-7);
  const first = recent[0][field];
  const last  = recent[recent.length - 1][field];
  if (first == null || last == null) return '<span style="color:#8b949e">→</span>';
  if (last < first) return '<span style="color:#00C853">↑</span>'; // improving (lower rank)
  if (last > first) return '<span style="color:#F44336">↓</span>'; // worsening
  return '<span style="color:#8b949e">→</span>';
}

function renderKeywordsSection(app, kwData) {
  const section = document.createElement('div');
  section.className = 'section';
  section.id = 'keywords';

  const updated = kwData?.updated ?? '–';
  const marketFlags = { DE: '🇩🇪', IT: '🇮🇹', FR: '🇫🇷', ES: '🇪🇸' };
  const marketNames = { DE: 'Deutschland', IT: 'Italien', FR: 'Frankreich', ES: 'Spanien' };

  section.innerHTML = `
    <div class="section-header">
      <div class="section-title">🔍 Keyword Rankings</div>
      <span class="last-updated">Stand: ${updated}</span>
    </div>
  `;

  const markets = ['DE', 'IT', 'FR', 'ES'];

  markets.forEach(market => {
    const kws = kwData?.keywords?.[market];
    if (!kws || kws.length === 0) return;

    const hasData = kws.some(k => k.data && k.data.length > 0);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '1.25rem';

    let tableRows = '';
    kws.forEach(kw => {
      const latest = kw.data && kw.data.length > 0 ? kw.data[kw.data.length - 1] : null;
      const org  = latest?.organic_rank ?? null;
      const trendOrg = getTrendArrow(kw.data, 'organic_rank');

      tableRows += `
        <tr style="border-bottom:1px solid #21262d">
          <td style="padding:0.5rem 0.75rem;font-size:0.83rem;color:#c9d1d9;max-width:220px;word-break:break-word">${kw.kw}</td>
          <td style="padding:0.5rem 0.75rem;text-align:center;font-size:0.83rem">${getRankBadge(org)} <span style="font-size:0.75rem">${trendOrg}</span></td>
          <td style="padding:0.5rem 0.75rem;font-size:0.75rem;color:#8b949e;font-family:monospace">${latest?.top3_asins?.[0] ?? '–'}</td>
        </tr>
      `;
    });

    card.innerHTML = `
      <div class="card-title" style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem">
        ${marketFlags[market]} ${marketNames[market]}
        ${!hasData ? '<span style="font-size:0.75rem;color:#8b949e;font-weight:400;margin-left:auto">⏳ Noch kein Run — Script ausführen</span>' : ''}
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:0.85rem">
          <thead>
            <tr style="border-bottom:1px solid #30363d">
              <th style="padding:0.5rem 0.75rem;text-align:left;color:#8b949e;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em">Keyword</th>
              <th style="padding:0.5rem 0.75rem;text-align:center;color:#8b949e;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em">Organisch</th>
              <th style="padding:0.5rem 0.75rem;text-align:left;color:#8b949e;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em">#1 ASIN</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      <div style="margin-top:0.75rem;display:flex;gap:1rem;flex-wrap:wrap;font-size:0.75rem;color:#8b949e">
        <span><span style="color:#00C853">■</span> ≤3 Top-3</span>
        <span><span style="color:#FFD600">■</span> 4-10 Sichtbar</span>
        <span><span style="color:#F44336">■</span> >10 / nicht gefunden</span>
        <span style="margin-left:auto"><span style="color:#00C853">↑</span> verbessert  <span style="color:#F44336">↓</span> verschlechtert  → stabil</span>
      </div>
    `;
    section.appendChild(card);

    // ── Werbung-Status Tabelle pro ASIN ───────────────────────────────────
    const adData = kwData?.ad_status?.[market];
    if (adData) {
      const adCard = document.createElement('div');
      adCard.className = 'card';
      adCard.style.marginBottom = '1.25rem';

      let adRows = '';
      Object.entries(adData).forEach(([asin, info]) => {
        const active = info.ad_active;
        const badge = active
          ? '<span style="color:#00C853;font-weight:600">✅ Sichtbar</span>'
          : '<span style="color:#F44336;font-weight:600">❌ Offline / nicht gefunden</span>';
        adRows += `
          <tr style="border-bottom:1px solid #21262d">
            <td style="padding:0.4rem 0.75rem;font-size:0.8rem;color:#c9d1d9">${info.name}</td>
            <td style="padding:0.4rem 0.75rem;font-size:0.75rem;color:#8b949e;font-family:monospace">${asin}</td>
            <td style="padding:0.4rem 0.75rem;text-align:center">${badge}</td>
          </tr>`;
      });

      adCard.innerHTML = `
        <div class="card-title" style="margin-bottom:0.75rem">📢 ${marketFlags[market]} Werbung-Status — alle FXCONTACTS ASINs</div>
        <p style="font-size:0.78rem;color:#8b949e;margin:0 0 0.75rem">Zeigt ob das ASIN in den aktuellen Amazon-Suchergebnissen sichtbar ist. ❌ = Werbung möglicherweise offline oder ASIN nicht indexiert → Tobias informieren!</p>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr style="border-bottom:1px solid #30363d">
                <th style="padding:0.4rem 0.75rem;text-align:left;color:#8b949e;font-size:0.75rem;text-transform:uppercase">Produkt</th>
                <th style="padding:0.4rem 0.75rem;text-align:left;color:#8b949e;font-size:0.75rem;text-transform:uppercase">ASIN</th>
                <th style="padding:0.4rem 0.75rem;text-align:center;color:#8b949e;font-size:0.75rem;text-transform:uppercase">Status</th>
              </tr>
            </thead>
            <tbody>${adRows}</tbody>
          </table>
        </div>`;

      section.appendChild(adCard);
    }
  });

  app.appendChild(section);
}

// Patch init() to also load keyword data
const _origInit = init;
init = async function() {
  await _origInit();
  // After BSR sections rendered, append keywords section
  const app = document.getElementById('app');
  const kwData = await loadKeywordData();
  renderKeywordsSection(app, kwData);

  // Re-observe new section for nav highlight
  const kwSection = document.getElementById('keywords');
  if (kwSection) {
    const navLinks = document.querySelectorAll('nav a');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(l => l.classList.remove('active'));
          const link = document.querySelector(`nav a[href="#${entry.target.id}"]`);
          if (link) link.classList.add('active');
        }
      });
    }, { threshold: 0.2 });
    observer.observe(kwSection);
  }
};

init();
</script>
