<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FXCONTACTS BSR Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #e0e6f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00C853, #69F0AE);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(90deg, #00C853, #69F0AE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #607090;
      margin-top: 2px;
    }

    .meta-badge {
      background: #161d30;
      border: 1px solid #1e2d48;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: #8899bb;
    }

    .meta-badge span {
      color: #00C853;
      font-weight: 600;
    }

    /* Country Navigation */
    .country-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .country-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f1525;
      border: 1px solid #1a2540;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      color: #8899bb;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .country-nav a:hover {
      color: #00C853;
      border-color: #00C853;
      background: #0a1520;
    }

    .country-nav a.active {
      color: #00C853;
      border-color: #00C853;
      background: #0a1520;
    }

    /* Country Section */
    .country-section {
      margin-bottom: 48px;
    }

    .country-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 40px 0 24px 0;
    }

    .country-divider:first-child {
      margin-top: 0;
    }

    .country-divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid #1a2540;
    }

    .country-header {
      font-size: 1.3rem;
      font-weight: 700;
      color: #c0d0f0;
      white-space: nowrap;
    }

    .country-sub {
      font-size: 0.8rem;
      color: #445070;
      margin-top: 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #0f1525;
      border: 1px solid #1a2540;
      border-radius: 12px;
      padding: 16px 18px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: #2a3a60;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 12px 12px 0 0;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #607090;
      margin-bottom: 8px;
    }

    .stat-asin {
      font-size: 0.68rem;
      color: #445070;
      font-family: monospace;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-rank {
      font-size: 0.75rem;
      color: #607090;
    }

    .stat-rank strong { color: #8899bb; }

    /* Index cards */
    .index-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .index-card {
      background: #0f1525;
      border: 1px solid #1a2540;
      border-radius: 12px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
      text-align: center;
    }

    .index-card:hover {
      transform: translateY(-2px);
      border-color: #2a3a60;
    }

    .index-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 12px 12px 0 0;
    }

    .index-label {
      font-size: 0.70rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #607090;
      margin-bottom: 8px;
    }

    .index-value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .index-value.green { color: #00C853; }
    .index-value.red   { color: #FF5252; }
    .index-value.neutral { color: #8899bb; }

    .index-hint {
      font-size: 0.68rem;
      color: #445070;
    }

    .index-hint.green { color: #00C853aa; }
    .index-hint.red   { color: #FF5252aa; }

    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #334060;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .chart-container {
      background: #0f1525;
      border: 1px solid #1a2540;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chart-title {
      font-size: 1rem;
      font-weight: 600;
      color: #c0d0f0;
    }

    .chart-hint {
      font-size: 0.75rem;
      color: #445070;
    }

    .canvas-wrapper {
      position: relative;
      height: 380px;
    }

    .canvas-wrapper.tall {
      height: 420px;
    }

    .legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0a0e1a;
      border: 1px solid #1a2540;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: #a0b0d0;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      color: #334060;
      font-size: 0.72rem;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #12192c;
    }

    .loading {
      text-align: center;
      padding: 80px;
      color: #445070;
    }

    .error-msg {
      background: #1a0810;
      border: 1px solid #4a1020;
      border-radius: 10px;
      padding: 20px;
      color: #ff6b6b;
      text-align: center;
      margin: 40px auto;
      max-width: 500px;
    }

    .no-data-notice {
      background: #0f1525;
      border: 1px solid #1a2540;
      border-radius: 10px;
      padding: 20px;
      color: #607090;
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-icon">👁️</div>
    <div>
      <h1>FXCONTACTS BSR Tracker</h1>
      <div class="subtitle">Amazon · Drogerie &amp; Körperpflege · Kontaktlinsen</div>
    </div>
  </div>
  <div class="meta-badge">
    Zuletzt aktualisiert: <span id="updated-date">–</span>
  </div>
</header>

<!-- Country Navigation -->
<nav class="country-nav">
  <a href="#section-de">🇩🇪 Deutschland</a>
  <a href="#section-it">🇮🇹 Italien</a>
  <a href="#section-fr">🇫🇷 Frankreich</a>
  <a href="#section-es">🇪🇸 Spanien</a>
</nav>

<div id="app">
  <div class="loading">⏳ Lade BSR-Daten…</div>
</div>

<footer>
  FXCONTACTS BSR Tracker · BRANDFARMER4YOU · Automatisch aktualisiert via GitHub Actions
</footer>

<script>
const DATA_URL = './data.json';

let chartIdCounter = 0;
function uniqueId(prefix) {
  return prefix + '-' + (++chartIdCounter);
}

function formatBsr(n) {
  return n ? n.toLocaleString('de-DE') : '–';
}

function getRankLabel(n) {
  if (!n) return '–';
  if (n <= 5000) return '🟢 Sehr gut';
  if (n <= 15000) return '🟡 Gut';
  if (n <= 50000) return '🟠 Mittel';
  return '🔴 Schwach';
}

async function loadData() {
  const resp = await fetch(DATA_URL + '?t=' + Date.now());
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

// ── Stat Cards (BSR absolut) ──────────────────────────────
function buildStatCards(series) {
  return series.map((s, i) => {
    const latest = s.data[s.data.length - 1];
    const bsr = latest ? latest.bsr : null;
    return `
      <div class="stat-card" style="--card-color:${s.color}">
        <div class="stat-card-bar" style="background:${s.color};position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;"></div>
        <div class="stat-label">${s.label}</div>
        <div class="stat-asin">${s.asin}</div>
        <div class="stat-value" style="color:${s.color}">${bsr ? '#' + formatBsr(bsr) : '–'}</div>
        <div class="stat-rank">${getRankLabel(bsr)}</div>
      </div>`;
  }).join('');
}

// ── Ranking Chart ─────────────────────────────────────────
function buildRankingChart(series, canvasId) {
  const seriesWithData = series.filter(s => s.data.length > 0);
  if (!seriesWithData.length) return false;

  const allDates = [...new Set(series.flatMap(s => s.data.map(d => d.date)))].sort();

  const datasets = series.map(s => {
    const isFx = s.id.startsWith('fxcontacts');
    const bsrMap = Object.fromEntries(s.data.map(d => [d.date, d.bsr]));
    const rankData = allDates.map(date => {
      const bsrs = seriesWithData.map(ss => {
        const m = Object.fromEntries(ss.data.map(d => [d.date, d.bsr]));
        return { id: ss.id, bsr: m[date] ?? null };
      }).filter(x => x.bsr !== null);
      bsrs.sort((a, b) => a.bsr - b.bsr);
      const myBsr = bsrMap[date];
      if (myBsr == null) return null;
      const rank = bsrs.findIndex(x => x.id === s.id) + 1;
      return rank > 0 ? rank : null;
    });
    return {
      label: s.label,
      data: rankData,
      borderColor: s.color,
      backgroundColor: s.color + '22',
      pointBackgroundColor: s.color,
      pointRadius: isFx ? 7 : 5,
      pointHoverRadius: 10,
      borderWidth: isFx ? 4 : 2,
      tension: 0.3,
      fill: false,
      spanGaps: true,
    };
  });

  const canvas = document.getElementById(canvasId);
  if (!canvas) return false;
  new Chart(canvas, {
    type: 'line',
    data: { labels: allDates, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f1525', borderColor: '#1a2540', borderWidth: 1,
          titleColor: '#c0d0f0', bodyColor: '#8899bb', padding: 12,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: Platz ${ctx.parsed.y ?? '–'}` }
        }
      },
      scales: {
        x: { grid: { color: '#121a2c' }, ticks: { color: '#445070', font: { size: 11 } } },
        y: {
          reverse: true, min: 1, max: seriesWithData.length,
          grid: { color: '#121a2c' },
          ticks: { color: '#445070', font: { size: 12 }, stepSize: 1, callback: v => 'Platz ' + v },
          title: { display: true, text: '← Besser    Ranking    Schlechter →', color: '#334060', font: { size: 10 } }
        }
      }
    }
  });
  return true;
}

// ── BSR Index Cards ───────────────────────────────────────
function buildIndexCards(series) {
  const seriesWithData = series.filter(s => s.data.length > 0);
  if (!seriesWithData.length) {
    return '<div class="no-data-notice">⚠️ Noch keine BSR-Daten verfügbar</div>';
  }

  // Basis: FXCONTACTS (first series with data), or first with data
  const fxSeries = series.find(s => s.id.startsWith('fxcontacts') && s.data.length > 0);
  const basisSeries = fxSeries || seriesWithData[0];
  const latestBasis = basisSeries.data[basisSeries.data.length - 1].bsr;

  return series.map((s, i) => {
    const latest = s.data[s.data.length - 1];
    const bsr = latest ? latest.bsr : null;
    let cls = 'neutral';
    let displayVal = '–';
    let hint = '';

    if (s.id === basisSeries.id) {
      displayVal = '100';
      cls = 'neutral';
      hint = 'Basis (= wir)';
    } else if (bsr && latestBasis) {
      const idx = Math.round((latestBasis / bsr) * 100);
      displayVal = idx.toString();
      if (idx >= 100) { cls = 'green'; hint = '✅ Schlechter als wir'; }
      else { cls = 'red'; hint = '⚠️ Besser als wir'; }
    } else if (!bsr) {
      hint = 'Keine Daten';
    }

    return `
      <div class="index-card">
        <div style="position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;background:${s.color};"></div>
        <div class="index-label">${s.label}</div>
        <div class="index-value ${cls}">${displayVal}</div>
        <div class="index-hint ${cls}">${hint}</div>
      </div>`;
  }).join('');
}

// ── BSR Absolute Chart ────────────────────────────────────
function buildBsrChart(series, canvasId) {
  const seriesWithData = series.filter(s => s.data.length > 0);
  if (!seriesWithData.length) return false;

  const allDates = [...new Set(series.flatMap(s => s.data.map(d => d.date)))].sort();
  const datasets = series.map(s => {
    const isFx = s.id.startsWith('fxcontacts');
    const dataMap = Object.fromEntries(s.data.map(d => [d.date, d.bsr]));
    return {
      label: s.label,
      data: allDates.map(d => dataMap[d] ?? null),
      borderColor: s.color,
      backgroundColor: s.color + '22',
      pointBackgroundColor: s.color,
      pointRadius: 5, pointHoverRadius: 8,
      borderWidth: isFx ? 3.5 : 2,
      tension: 0.3, fill: false, spanGaps: true,
    };
  });

  const canvas = document.getElementById(canvasId);
  if (!canvas) return false;
  new Chart(canvas, {
    type: 'line',
    data: { labels: allDates, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f1525', borderColor: '#1a2540', borderWidth: 1,
          titleColor: '#c0d0f0', bodyColor: '#8899bb', padding: 12,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: #${ctx.parsed.y ? ctx.parsed.y.toLocaleString('de-DE') : '–'}` }
        }
      },
      scales: {
        x: { grid: { color: '#121a2c' }, ticks: { color: '#445070', font: { size: 11 } } },
        y: {
          reverse: true, grid: { color: '#121a2c' },
          ticks: { color: '#445070', font: { size: 11 }, callback: v => '#' + v.toLocaleString('de-DE') },
          title: { display: true, text: '← Besser    BSR-Rang    Schlechter →', color: '#334060', font: { size: 10 } }
        }
      }
    }
  });
  return true;
}

function buildLegend(series) {
  return series.map(s => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${s.color}"></div>
      <span>${s.label}</span>
    </div>`).join('');
}

// ── Build country section HTML ────────────────────────────
function buildCountrySection(opts) {
  const { id, flag, title, subtitle, series } = opts;
  const rankId = 'ranking-' + id;
  const bsrId = 'bsr-' + id;
  const hasData = series.some(s => s.data.length > 0);

  return `
    <div class="country-divider" id="section-${id}">
      <hr>
      <div>
        <div class="country-header">${flag} ${title}</div>
        <div class="country-sub">${subtitle}</div>
      </div>
      <hr>
    </div>

    <div class="section-label">📊 Aktueller BSR</div>
    <div class="stats-grid">${buildStatCards(series)}</div>

    ${hasData ? `
    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-title">🏆 Ranking über Zeit (Platz 1 = Bester BSR)</div>
        <div class="chart-hint">FXCONTACTS-Linien = fett · Platz 1 = niedrigster BSR</div>
      </div>
      <div class="canvas-wrapper tall"><canvas id="${rankId}"></canvas></div>
      <div class="legend-grid">${buildLegend(series)}</div>
    </div>

    <div class="section-label">🎯 BSR-Index (FXCONTACTS = 100)</div>
    <div class="index-grid">${buildIndexCards(series)}</div>

    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-title">📈 BSR-Verlauf absolut – Detail-Ansicht</div>
        <div class="chart-hint">Invertierte Y-Achse: niedriger = besser</div>
      </div>
      <div class="canvas-wrapper"><canvas id="${bsrId}"></canvas></div>
      <div class="legend-grid">${buildLegend(series)}</div>
    </div>
    ` : `
    <div class="no-data-notice">⚠️ Noch keine BSR-Daten für dieses Land – FXCONTACTS ist hier möglicherweise nicht gelistet. Konkurrenten werden täglich aktualisiert.</div>
    <div class="section-label">🎯 BSR-Index (FXCONTACTS = 100)</div>
    <div class="index-grid">${buildIndexCards(series)}</div>
    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-title">📈 BSR-Verlauf absolut – Detail-Ansicht</div>
        <div class="chart-hint">Invertierte Y-Achse: niedriger = besser</div>
      </div>
      <div class="canvas-wrapper"><canvas id="${bsrId}"></canvas></div>
      <div class="legend-grid">${buildLegend(series)}</div>
    </div>
    `}
  `;
}

async function init() {
  const app = document.getElementById('app');
  try {
    const data = await loadData();
    document.getElementById('updated-date').textContent = data.updated;

    // ── DE Section (original layout preserved) ──
    const deHtml = `
      <div class="country-divider" id="section-de">
        <hr>
        <div>
          <div class="country-header">🇩🇪 Deutschland</div>
          <div class="country-sub">amazon.de · Drogerie &amp; Körperpflege</div>
        </div>
        <hr>
      </div>

      <div class="section-label">📊 Aktueller BSR</div>
      <div class="stats-grid">${buildStatCards(data.series)}</div>

      <div class="chart-container">
        <div class="chart-header">
          <div class="chart-title">🏆 Ranking über Zeit (Platz 1 = Bester BSR)</div>
          <div class="chart-hint">FXCONTACTS-Linien = fett · Platz 1 = niedrigster BSR</div>
        </div>
        <div class="canvas-wrapper tall"><canvas id="ranking-de"></canvas></div>
        <div class="legend-grid">${buildLegend(data.series)}</div>
      </div>

      <div class="section-label">🎯 BSR-Index (FXCONTACTS 12M = 100)</div>
      <div class="index-grid">${buildIndexCards(data.series)}</div>

      <div class="chart-container">
        <div class="chart-header">
          <div class="chart-title">📈 BSR-Verlauf absolut – Detail-Ansicht</div>
          <div class="chart-hint">Invertierte Y-Achse: niedriger = besser</div>
        </div>
        <div class="canvas-wrapper"><canvas id="bsr-de"></canvas></div>
        <div class="legend-grid">${buildLegend(data.series)}</div>
      </div>
    `;

    // ── IT Section ──
    const itHtml = data.series_it ? buildCountrySection({
      id: 'it', flag: '🇮🇹', title: 'Italien', subtitle: 'amazon.it · Salute e cura della persona',
      series: data.series_it
    }) : '';

    // ── FR Section ──
    const frHtml = data.series_fr ? buildCountrySection({
      id: 'fr', flag: '🇫🇷', title: 'Frankreich', subtitle: 'amazon.fr · Hygiène et Santé',
      series: data.series_fr
    }) : '';

    // ── ES Section ──
    const esHtml = data.series_es ? buildCountrySection({
      id: 'es', flag: '🇪🇸', title: 'Spanien', subtitle: 'amazon.es · Salud y cuidado personal',
      series: data.series_es
    }) : '';

    app.innerHTML = deHtml + itHtml + frHtml + esHtml;

    // Build all charts
    buildRankingChart(data.series, 'ranking-de');
    buildBsrChart(data.series, 'bsr-de');

    if (data.series_it) {
      buildRankingChart(data.series_it, 'ranking-it');
      buildBsrChart(data.series_it, 'bsr-it');
    }
    if (data.series_fr) {
      buildRankingChart(data.series_fr, 'ranking-fr');
      buildBsrChart(data.series_fr, 'bsr-fr');
    }
    if (data.series_es) {
      buildRankingChart(data.series_es, 'ranking-es');
      buildBsrChart(data.series_es, 'bsr-es');
    }

  } catch (err) {
    app.innerHTML = `<div class="error-msg">
      <strong>Fehler beim Laden der BSR-Daten</strong><br>
      <small>${err.message}</small>
    </div>`;
  }
}

init();
</script>
</body>
</html>
