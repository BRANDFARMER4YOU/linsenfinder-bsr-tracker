name: Daily BSR Update

on:
  schedule:
    - cron: '0 7 * * *'  # täglich 08:00 Uhr CET (07:00 UTC)
  workflow_dispatch:       # manueller Start möglich

permissions:
  contents: write

jobs:
  update-bsr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run BSR updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python3 update_bsr.py

      - name: Generate KI-Lageberichte (analysis.json)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 generate_analysis.py

      - name: Commit analysis.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis.json
          git diff --cached --quiet && echo "Keine Aenderungen" || git commit -m "Update analysis.json $(date +%Y-%m-%d)"
          # update_bsr.py pusht data.json bereits per API waehrend des Laufs --
          # dadurch ist der lokale Checkout beim Push oft schon veraltet.
          # Deshalb vor dem Push rebasen, um Race-Condition-Fehler zu vermeiden.
          git pull --rebase origin main
          git push
